<!doctype html>
<html lang="tr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Şablonlu, tarayıcıda çalışan CV editörü" />
    <title>CVeditör</title>
    <script>
      // Tema ve vurgu rengi ilk boyamadan önce uygulanır (yanıp sönme olmasın).
      try {
        var t = localStorage.getItem('cveditor:theme')
        if (t === 'dark') document.documentElement.dataset.theme = 'dark'
        // src/lib/prefs.ts ACCENTS ile aynı liste: [açık, koyu]
        var a = {
          petrol: ['#00786f', '#2cc7b5'],
          murekkep: ['#0a5fd8', '#5cb8ff'],
          kiremit: ['#b8500f', '#ffa056'],
          orman: ['#1b7f3b', '#4ad968'],
          grafit: ['#48484a', '#d1d1d6'],
        }[localStorage.getItem('cveditor:accent')]
        if (a) {
          document.documentElement.style.setProperty('--accent-light', a[0])
          document.documentElement.style.setProperty('--accent-dark', a[1])
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
